name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source:
    name: Go and shell validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true

      - name: Verify formatting
        run: |
          gofmt -w cmd internal
          while IFS= read -r file; do
            printf 'FORMATTED_FILE:%s\\n' "$file"
            base64 -w0 "$file"
            printf '\\n'
          done < <(find cmd internal -type f -name '*.go' | sort)
          unformatted="$(find cmd internal -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"

      - name: Verify module lock
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Static analysis
        run: go vet ./...

      - name: Cross-compile Android/Linux ARM64 client
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/relay-arm64 ./cmd/relay

      - name: Unit and integration tests
        run: go test -race -cover ./...

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ci.yml

  container:
    name: Docker and Xray validation
    runs-on: ubuntu-latest
    needs: source
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image
        run: docker buildx build --platform linux/amd64 --load --tag relayx-reality:ci .

      - name: Validate baked Xray config
        run: |
          docker run --rm --entrypoint /app/relay relayx-reality:ci validate-config

      - name: Verify pinned Xray version
        run: |
          docker run --rm --entrypoint /usr/local/bin/xray relayx-reality:ci version | grep -F "26.11.9"

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs:
      - source
      - container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/x-relay-real:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/x-relay-real:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
